# pipeline_config.yaml
# The severity_method line is overwritten by benchmark_severity.py after training.
# Edit other values to tune runtime behaviour.

severity_method: cnn

detector_conf:       0.35  # Stage 1 confidence threshold (lowered from 0.40 to recover near/mid lights)
detector_imgsz:      640   # Photo page inference size (close-up potholes — 640 is best for them)
video_imgsz:         1280  # Video page inference size (small/distant lights + potholes need higher res)
pothole_conf:        0.40  # Stricter threshold for potholes only (traffic lights use detector_conf)
nms_iou:             0.45  # NMS IoU threshold (used by YOLO internally)

# Traffic light lane-relevance thresholds
lane_x_min:          0.20  # x_center must be > 20% of frame width
lane_x_max:          0.80  # x_center must be < 80% of frame width
lane_min_size_ratio: 0.001 # box_area / frame_area must exceed this
tl_min_aspect_ratio: 1.2   # height/width of box must exceed this
